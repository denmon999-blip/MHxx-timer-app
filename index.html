<body class="night-mode">
<div class="container">
    <h2>1000カウント・メトロノーム</h2>
    
    <!-- メトロノーム Target計算フォーム -->
    <div class="calc-setting" style="text-align: center;">
        <div style="margin-bottom: 5px;">
            <label style="width: auto; margin-right: 5px;">A:</label>
            <input type="number" id="metroCalcA" class="wide-input" placeholder="5-6桁">
            <label style="width: auto; margin-left: 5px; margin-right: 5px;">B:</label>
            <input type="number" id="metroCalcB" style="width: 50px;" placeholder="2桁秒">
        </div>
        <button class="calc-btn" onclick="calculateAndApplyTarget()">計算してターゲットに適用</button>
    </div>

    <div>
        <label for="targetCount" style="color: #007bff; font-weight: bold;">Target:</label>
        <input type="number" id="targetCount" value="1000" min="1">
    </div>
    <div id="display" class="count-display">0</div>
    <div>
        <label style="color: #ff0000; font-weight: bold;">BPM: </label>
        <!-- デフォルトを 100 に変更 -->
        <input type="number" id="bpm" value="100" min="40" max="300">
    </div>
    <div class="controls">
        <button id="startMetronomeBtn" class="start" onclick="toggleMetronome()" style="display: inline-block;">スタート</button>
        <button id="stopMetronomeBtn" class="stop" onclick="toggleMetronome()" style="display: none;">ストップ</button>
        <button id="resetMetronomeBtn" class="reset" onclick="resetMetronome()">リセット</button>
    </div>

    <!-- Stopwatch Section -->
    <div class="section">
        <h3 style="font-size: 1.8rem; color: #007bff; margin-top: 0;">ストップウォッチ</h3>
        <div id="stopwatchDisplay" class="stopwatch-display">00:00.000</div>
        <div class="stopwatch-controls">
            <button id="startStopwatchBtn" class="start" onclick="startStopwatch()" style="display: inline-block;">スタート</button>
            <button id="delayStartStopwatchBtn" class="delay-start" onclick="startDelayedStopwatchStart()" style="display: inline-block;">2.00秒後スタート</button>
            <button id="stopStopwatchBtn" class="stop" onclick="stopStopwatch()" style="display: none;">ストップ</button>
            <button id="delayStopStopwatchBtn" class="delay-stop" onclick="startDelayedStopwatchStop()" style="display: none;">2.00秒後停止</button>
            <button id="lapStopwatchBtn" class="reset" onclick="lapStopwatch()" style="display: none;">ラップ</button>
            <button id="resetStopwatchBtn" class="reset" onclick="resetStopwatch()">リセット</button>
        </div>
        <div>
            <button id="transferToCountdownBtn" class="transfer-btn" onclick="transferToCountdownUp()">タイムを切り上げに適用</button>
        </div>
        <ul id="lapTimesList"></ul>
    </div>

    <!-- Countdown Timer 1 Section -->
    <div class="section">
        <h3 style="font-size: 1.8rem; color: #007bff; margin-top: 0;">カウントダウンタイマー1</h3>
        <div id="countdownPhaseLabel" class="countdown-phase-label">待機中</div>
        <div id="countdownDisplay" class="countdown-display">00 分 30 秒 00</div>

        <div class="setting">
            <label>待機時間</label>
            <input type="number" id="countdownMin" value="0"> 分 <input type="number" id="countdownSec" value="30" step="0.001"> 秒
        </div>
        <!-- 待機時間の計算用パラメータ A, B, C -->
        <div class="setting calc-setting">
            <div style="margin-bottom: 5px;">
                <label style="width: auto; margin-right: 5px;">A:</label>
                <input type="number" id="calcA" class="wide-input" placeholder="5-6桁">
                <label style="width: auto; margin-left: 5px; margin-right: 5px;">B:</label>
                <input type="number" id="calcB" class="wide-input" placeholder="5-6桁">
                <label style="width: auto; margin-left: 5px; margin-right: 5px;">C:</label>
                <input type="number" id="calcC" style="width: 45px;" placeholder="1-2桁" value="0">
            </div>
            <div style="text-align: center;">
                <button class="calc-btn" onclick="calculateAndApplyWaitTime()">(A-B-C)/30 を待機時間に適用</button>
            </div>
        </div>
        <div class="setting">
            <label>開始までの猶予</label>
            <!-- デフォルトを 3 秒に変更 -->
            <input type="number" id="countdownDelayMin" value="0"> 分 <input type="number" id="countdownDelaySec" value="3" step="0.001"> 秒
        </div>
        <div class="setting">
            <label>切り上げ</label>
            <input type="number" id="countdownUpMin" value="0"> 分 <input type="number" id="countdownUpSec" value="0" step="0.001"> 秒
        </div>
        <div class="setting" style="text-align: center; margin-top: 15px;">
            <input type="checkbox" id="countdownLoopEnable"> 無限ループ
            <input type="checkbox" id="countdownSoundEnable" checked="" style="margin-left: 15px;"> サウンド有効
        </div>

        <div class="controls">
            <button id="startCountdownBtn" class="start">開始</button>
            <button id="stopCountdownBtn" class="stop">停止</button>
            <button id="resetCountdownBtn" class="reset">リセット</button>
        </div>
    </div>

    <!-- Countdown Timer 2 Section -->
    <div class="section">
        <h3 style="font-size: 1.8rem; color: #007bff; margin-top: 0;">カウントダウンタイマー2</h3>
        <div id="countdown2PhaseLabel" class="countdown-phase-label">待機中</div>
        <div id="countdown2Display" class="countdown-display">00 分 30 秒 00</div>

        <div class="setting">
            <label>待機時間</label>
            <input type="number" id="countdown2Min" value="0"> 分 <input type="number" id="countdown2Sec" value="30" step="0.001"> 秒
        </div>
        <div class="setting">
            <label>開始までの猶予</label>
            <input type="number" id="countdown2DelayMin" value="0"> 分 <input type="number" id="countdown2DelaySec" value="3" step="0.001"> 秒
        </div>

        <!-- カウントダウンタイマー2用 パラメータ A, B, C 計算枠 -->
        <div class="setting calc-setting">
            <div style="margin-bottom: 5px; text-align: center;">
                <label style="width: auto; margin-right: 2px;">A:</label>
                <input type="number" id="calc2A" style="width: 65px;" placeholder="4桁">
                <label style="width: auto; margin-left: 2px; margin-right: 2px;">B:</label>
                <input type="number" id="calc2B" style="width: 45px;" placeholder="1-2桁">
                <label style="width: auto; margin-left: 2px; margin-right: 2px;">C:</label>
                <input type="number" id="calc2C" style="width: 50px;" placeholder="2桁秒">
            </div>
            <div style="text-align: center;">
                <button class="calc-btn" onclick="calculateAndApplyTimer2()">Cを待機時間、((A-B-700)/30)-C を猶予に適用</button>
            </div>
        </div>

        <div class="setting" style="text-align: center; margin-top: 15px;">
            <input type="checkbox" id="countdown2LoopEnable"> 無限ループ
            <input type="checkbox" id="countdown2SoundEnable" checked="" style="margin-left: 15px;"> サウンド有効
        </div>

        <div class="controls">
            <button id="startCountdown2Btn" class="start">開始</button>
            <button id="stopCountdown2Btn" class="stop">停止</button>
            <button id="resetCountdown2Btn" class="reset">リセット</button>
        </div>
    </div>

    <div class="section">
        <button class="toggle-mode-btn" onclick="toggleNightMode()">モード切り替え</button>
    </div>
</div>

<script>
    let count = 0;
    let metronomeTimer = null;
    let audioCtx = null;

    // Countdown Timer 1 variables
    let countdownTimerId = null;
    let countdownStartTime = 0;
    let countdownPhase = "idle";
    let countdownTotalMs = 0;
    let countdownDelayMs = 0;
    let countdownEarlyFinishMs = 0;
    let countdownLastBeepedSecond = -1;

    // Countdown Timer 2 variables
    let countdown2TimerId = null;
    let countdown2StartTime = 0;
    let countdown2Phase = "idle";
    let countdown2TotalMs = 0;
    let countdown2DelayMs = 0;
    let countdown2LastBeepedSecond = -1;

    // Stopwatch variables
    let stopwatchStartTime = 0;
    let stopwatchElapsedTime = 0;
    let stopwatchTimer = null;
    let stopwatchRunning = false;
    let lapTimes = [];
    let stopwatchDelayStopTimer = null;
    let stopwatchDelayStartTimer = null;

    // --- メトロノーム Target 計算関数 ---
    function calculateAndApplyTarget() {
        const valA = parseFloat(document.getElementById('metroCalcA').value) || 0;
        const valB = parseFloat(document.getElementById('metroCalcB').value) || 0;
        const valC = parseFloat(document.getElementById('bpm').value) || 100; // C = BPM

        if (valC === 0) return;

        // 計算式: (A - B * 30) * (700 - 1800 / C) / 490000
        const result = (valA - valB * 30) * (700 - (1800 / valC)) / 490000;

        if (result < 0) {
            alert('計算結果がマイナスになりました。入力値を確認してください。');
            return;
        }

        // 繰り下げ（切り捨て）して整数でTargetに入力
        const targetInt = Math.floor(result);
        document.getElementById('targetCount').value = targetInt;
    }

    function playSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const target = parseInt(document.getElementById('targetCount').value) || 1000;
        const remaining = target - count;

        const isLastTen = (remaining >= 0 && remaining < 10);

        osc.type = isLastTen ? 'sine' : 'square';
        osc.frequency.setValueAtTime(isLastTen ? 880 : 440, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function toggleMetronome() {
        const startBtn = document.getElementById('startMetronomeBtn');
        const stopBtn = document.getElementById('stopMetronomeBtn');
        const bpmInput = document.getElementById('bpm');
        const targetCountInput = document.getElementById('targetCount');
        const target = parseInt(targetCountInput.value);

        if (metronomeTimer) {
            clearInterval(metronomeTimer);
            metronomeTimer = null;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        } else {
            const interval = 60000 / bpmInput.value;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';

            metronomeTimer = setInterval(() => {
                count++;
                document.getElementById('display').innerText = count;
                playSound();

                if (count >= target) {
                    clearInterval(metronomeTimer);
                    toggleMetronome();
                    count = 0;
                    document.getElementById('display').innerText = count;
                }
            }, interval);
        }
    }

    function resetMetronome() {
        const startBtn = document.getElementById('startMetronomeBtn');
        const stopBtn = document.getElementById('stopMetronomeBtn');
        if (metronomeTimer) {
            clearInterval(metronomeTimer);
            metronomeTimer = null;
        }
        count = 0;
        document.getElementById('display').innerText = count;
        startBtn.style.display = 'inline-block';
        stopBtn.style.display = 'none';
    }

    // カウントダウン1: (A - B - C) / 30 の計算関数
    function calculateAndApplyWaitTime() {
        const valA = parseFloat(document.getElementById('calcA').value) || 0;
        const valB = parseFloat(document.getElementById('calcB').value) || 0;
        const valC = parseFloat(document.getElementById('calcC').value) || 0;

        const totalSeconds = (valA - valB - valC) / 30;

        if (totalSeconds < 0) {
            alert('計算結果がマイナスになりました。入力値を確認してください。');
            return;
        }

        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        document.getElementById('countdownMin').value = minutes;
        document.getElementById('countdownSec').value = parseFloat(seconds.toFixed(3));
        
        if (countdownPhase === "idle") {
            resetCountdownTimer();
        }
    }

    // --- カウントダウンタイマー2用 計算関数 ---
    function calculateAndApplyTimer2() {
        const valA = parseFloat(document.getElementById('calc2A').value) || 0;
        const valB = parseFloat(document.getElementById('calc2B').value) || 0;
        const valC = parseFloat(document.getElementById('calc2C').value) || 0; // 秒数

        // 1. C を待機時間に入力
        const waitMin = Math.floor(valC / 60);
        const waitSec = valC % 60;
        document.getElementById('countdown2Min').value = waitMin;
        document.getElementById('countdown2Sec').value = parseFloat(waitSec.toFixed(3));

        // 2. ((A - B - 700) / 30) - C を開始までの猶予に入力（小数点3桁まで）
        const delayTotalSec = ((valA - valB - 700) / 30) - valC;

        if (delayTotalSec < 0) {
            alert('猶予の計算結果がマイナスになりました。入力値を確認してください。');
            return;
        }

        const delayMin = Math.floor(delayTotalSec / 60);
        const delaySec = delayTotalSec % 60;

        document.getElementById('countdown2DelayMin').value = delayMin;
        document.getElementById('countdown2DelaySec').value = parseFloat(delaySec.toFixed(3));

        if (countdown2Phase === "idle") {
            resetCountdown2Timer();
        }
    }

    // --- Countdown Timer 1 functions ---
    function playBeepCountdown(isSoundEnabled = true) {
        if (!isSoundEnabled) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 880;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function updateCountdownDisplay(ms) {
        const countdownDisplay = document.getElementById('countdownDisplay');
        if (ms < 0) ms = 0;
        const totalSec = Math.floor(ms / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        const cs = Math.floor((ms % 1000) / 10);
        countdownDisplay.textContent = `${String(m).padStart(2, '0')} 分 ${String(s).padStart(2, '0')} 秒 ${String(cs).padStart(2, '0')}`;
    }

    function runCountdown() {
        const now = Date.now();
        let elapsedMsFromPhaseStart = now - countdownStartTime;
        let currentPhaseRemainingMs;
        const countdownLabel = document.getElementById('countdownPhaseLabel');

        if (countdownPhase === "delay") {
            currentPhaseRemainingMs = countdownDelayMs - elapsedMsFromPhaseStart;
            countdownLabel.textContent = "開始までの猶予...";
        } else if (countdownPhase === "active") {
            const currentPhaseTotalDurationMs = countdownTotalMs - countdownEarlyFinishMs;
            currentPhaseRemainingMs = currentPhaseTotalDurationMs - elapsedMsFromPhaseStart;
            countdownLabel.textContent = "カウント中";
        } else {
            return;
        }

        if (countdownPhase === "delay" || countdownPhase === "active") {
            const currentSecondsLeft = Math.floor(currentPhaseRemainingMs / 1000);
            if (currentSecondsLeft >= 0 && currentSecondsLeft < 10) {
                if (currentSecondsLeft !== countdownLastBeepedSecond) {
                    playBeepCountdown(document.getElementById('countdownSoundEnable').checked);
                    countdownLastBeepedSecond = currentSecondsLeft;
                }
            }
        }

        updateCountdownDisplay(currentPhaseRemainingMs);

        if (currentPhaseRemainingMs <= 0) {
            if (countdownPhase === "delay") {
                countdownPhase = "active";
                countdownStartTime = Date.now();
                countdownLabel.textContent = "カウント中";
                countdownLastBeepedSecond = -1;
            } else if (countdownPhase === "active") {
                playBeepCountdown(document.getElementById('countdownSoundEnable').checked);
                if (document.getElementById('countdownLoopEnable').checked) {
                    initAndStartCountdown();
                } else {
                    stopCountdownTimer();
                    updateCountdownDisplay(0);
                    countdownLabel.textContent = "終了";
                }
            }
        }
    }

    function initAndStartCountdown() {
        countdownTotalMs = (parseInt(document.getElementById('countdownMin').value || 0) * 60 + parseFloat(document.getElementById('countdownSec').value || 0)) * 1000;
        countdownDelayMs = (parseInt(document.getElementById('countdownDelayMin').value || 0) * 60 + parseFloat(document.getElementById('countdownDelaySec').value || 0)) * 1000;
        countdownEarlyFinishMs = (parseInt(document.getElementById('countdownUpMin').value || 0) * 60 + parseFloat(document.getElementById('countdownUpSec').value || 0)) * 1000;
        countdownStartTime = Date.now();

        if (countdownDelayMs > 0) {
            countdownPhase = "delay";
            document.getElementById('countdownPhaseLabel').textContent = "開始までの猶予...";
        } else {
            countdownPhase = "active";
            document.getElementById('countdownPhaseLabel').textContent = "カウント中";
        }
        countdownLastBeepedSecond = -1;

        updateCountdownDisplay(countdownPhase === "delay" ? countdownDelayMs : (countdownTotalMs - countdownEarlyFinishMs));

        if (countdownTimerId) clearInterval(countdownTimerId);
        countdownTimerId = setInterval(runCountdown, 10);
    }

    function stopCountdownTimer() {
        if (countdownTimerId) {
            clearInterval(countdownTimerId);
            countdownTimerId = null;
        }
        countdownPhase = "idle";
        document.getElementById('countdownPhaseLabel').textContent = "待機中";
        countdownLastBeepedSecond = -1;
    }

    function resetCountdownTimer() {
        stopCountdownTimer();
        const initialMin = parseInt(document.getElementById('countdownMin').value) || 0;
        const initialSec = parseFloat(document.getElementById('countdownSec').value) || 0;
        updateCountdownDisplay((initialMin * 60 + initialSec) * 1000);
        document.getElementById('countdownPhaseLabel').textContent = "待機中";
        countdownLastBeepedSecond = -1;
    }

    // --- Countdown Timer 2 functions ---
    function updateCountdown2Display(ms) {
        const countdownDisplay = document.getElementById('countdown2Display');
        if (ms < 0) ms = 0;
        const totalSec = Math.floor(ms / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        const cs = Math.floor((ms % 1000) / 10);
        countdownDisplay.textContent = `${String(m).padStart(2, '0')} 分 ${String(s).padStart(2, '0')} 秒 ${String(cs).padStart(2, '0')}`;
    }

    function runCountdown2() {
        const now = Date.now();
        let elapsedMsFromPhaseStart = now - countdown2StartTime;
        let currentPhaseRemainingMs;
        const countdownLabel = document.getElementById('countdown2PhaseLabel');

        if (countdown2Phase === "delay") {
            currentPhaseRemainingMs = countdown2DelayMs - elapsedMsFromPhaseStart;
            countdownLabel.textContent = "開始までの猶予...";
        } else if (countdown2Phase === "active") {
            currentPhaseRemainingMs = countdown2TotalMs - elapsedMsFromPhaseStart;
            countdownLabel.textContent = "カウント中";
        } else {
            return;
        }

        if (countdown2Phase === "delay" || countdown2Phase === "active") {
            const currentSecondsLeft = Math.floor(currentPhaseRemainingMs / 1000);
            if (currentSecondsLeft >= 0 && currentSecondsLeft < 10) {
                if (currentSecondsLeft !== countdown2LastBeepedSecond) {
                    playBeepCountdown(document.getElementById('countdown2SoundEnable').checked);
                    countdown2LastBeepedSecond = currentSecondsLeft;
                }
            }
        }

        updateCountdown2Display(currentPhaseRemainingMs);

        if (currentPhaseRemainingMs <= 0) {
            if (countdown2Phase === "delay") {
                countdown2Phase = "active";
                countdown2StartTime = Date.now();
                countdownLabel.textContent = "カウント中";
                countdown2LastBeepedSecond = -1;
            } else if (countdown2Phase === "active") {
                playBeepCountdown(document.getElementById('countdown2SoundEnable').checked);
                if (document.getElementById('countdown2LoopEnable').checked) {
                    initAndStartCountdown2();
                } else {
                    stopCountdown2Timer();
                    updateCountdown2Display(0);
                    countdownLabel.textContent = "終了";
                }
            }
        }
    }

    function initAndStartCountdown2() {
        countdown2TotalMs = (parseInt(document.getElementById('countdown2Min').value || 0) * 60 + parseFloat(document.getElementById('countdown2Sec').value || 0)) * 1000;
        countdown2DelayMs = (parseInt(document.getElementById('countdown2DelayMin').value || 0) * 60 + parseFloat(document.getElementById('countdown2DelaySec').value || 0)) * 1000;
        countdown2StartTime = Date.now();

        if (countdown2DelayMs > 0) {
            countdown2Phase = "delay";
            document.getElementById('countdown2PhaseLabel').textContent = "開始までの猶予...";
        } else {
            countdown2Phase = "active";
            document.getElementById('countdown2PhaseLabel').textContent = "カウント中";
        }
        countdown2LastBeepedSecond = -1;

        updateCountdown2Display(countdown2Phase === "delay" ? countdown2DelayMs : countdown2TotalMs);

        if (countdown2TimerId) clearInterval(countdown2TimerId);
        countdown2TimerId = setInterval(runCountdown2, 10);
    }

    function stopCountdown2Timer() {
        if (countdown2TimerId) {
            clearInterval(countdown2TimerId);
            countdown2TimerId = null;
        }
        countdown2Phase = "idle";
        document.getElementById('countdown2PhaseLabel').textContent = "待機中";
        countdown2LastBeepedSecond = -1;
    }

    function resetCountdown2Timer() {
        stopCountdown2Timer();
        const initialMin = parseInt(document.getElementById('countdown2Min').value) || 0;
        const initialSec = parseFloat(document.getElementById('countdown2Sec').value) || 0;
        updateCountdown2Display((initialMin * 60 + initialSec) * 1000);
        document.getElementById('countdown2PhaseLabel').textContent = "待機中";
        countdown2LastBeepedSecond = -1;
    }

    // --- Stopwatch functions ---
    function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const milliseconds = Math.floor(ms % 1000);
        return (
            minutes.toString().padStart(2, '0') + ':' +
            seconds.toString().padStart(2, '0') + '.' +
            milliseconds.toString().padStart(3, '0')
        );
    }

    function updateStopwatchDisplay() {
        const stopwatchDisplay = document.getElementById('stopwatchDisplay');
        const currentTime = Date.now();
        const currentElapsedTime = stopwatchRunning ? currentTime - stopwatchStartTime + stopwatchElapsedTime : stopwatchElapsedTime;
        stopwatchDisplay.innerText = formatTime(currentElapsedTime);
    }

    function clearDelayTimersState() {
        if (stopwatchDelayStopTimer) {
            clearInterval(stopwatchDelayStopTimer);
            stopwatchDelayStopTimer = null;
        }
        if (stopwatchDelayStartTimer) {
            clearInterval(stopwatchDelayStartTimer);
            stopwatchDelayStartTimer = null;
        }
        const delayStopBtn = document.getElementById('delayStopStopwatchBtn');
        if (delayStopBtn) {
            delayStopBtn.innerText = '2.00秒後停止';
            delayStopBtn.disabled = false;
        }
        const delayStartBtn = document.getElementById('delayStartStopwatchBtn');
        if (delayStartBtn) {
            delayStartBtn.innerText = '2.00秒後スタート';
            delayStartBtn.disabled = false;
        }
    }

    function startStopwatch() {
        const startStopwatchBtn = document.getElementById('startStopwatchBtn');
        const delayStartStopwatchBtn = document.getElementById('delayStartStopwatchBtn');
        const stopStopwatchBtn = document.getElementById('stopStopwatchBtn');
        const delayStopStopwatchBtn = document.getElementById('delayStopStopwatchBtn');
        const lapStopwatchBtn = document.getElementById('lapStopwatchBtn');

        if (!stopwatchRunning) {
            clearDelayTimersState();
            stopwatchStartTime = Date.now();
            stopwatchTimer = setInterval(updateStopwatchDisplay, 10);
            stopwatchRunning = true;

            startStopwatchBtn.style.display = 'none';
            delayStartStopwatchBtn.style.display = 'none';
            stopStopwatchBtn.style.display = 'inline-block';
            delayStopStopwatchBtn.style.display = 'inline-block';
            lapStopwatchBtn.style.display = 'inline-block';
        }
    }

    function startDelayedStopwatchStart() {
        if (stopwatchRunning || stopwatchDelayStartTimer) return;

        const delayBtn = document.getElementById('delayStartStopwatchBtn');
        const delayDuration = 2000;
        const startTime = Date.now();

        delayBtn.disabled = true;

        stopwatchDelayStartTimer = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, delayDuration - elapsed);

            if (remaining > 0) {
                delayBtn.innerText = `${(remaining / 1000).toFixed(2)}s後スタート`;
            } else {
                clearDelayTimersState();
                startStopwatch();
            }
        }, 10);
    }

    function stopStopwatch() {
        const startStopwatchBtn = document.getElementById('startStopwatchBtn');
        const delayStartStopwatchBtn = document.getElementById('delayStartStopwatchBtn');
        const stopStopwatchBtn = document.getElementById('stopStopwatchBtn');
        const delayStopStopwatchBtn = document.getElementById('delayStopStopwatchBtn');
        const lapStopwatchBtn = document.getElementById('lapStopwatchBtn');

        if (stopwatchRunning) {
            clearDelayTimersState();
            clearInterval(stopwatchTimer);
            stopwatchElapsedTime += Date.now() - stopwatchStartTime;
            stopwatchRunning = false;

            startStopwatchBtn.style.display = 'inline-block';
            delayStartStopwatchBtn.style.display = 'inline-block';
            stopStopwatchBtn.style.display = 'none';
            delayStopStopwatchBtn.style.display = 'none';
            lapStopwatchBtn.style.display = 'none';
        }
    }

    function startDelayedStopwatchStop() {
        if (!stopwatchRunning || stopwatchDelayStopTimer) return;

        const delayBtn = document.getElementById('delayStopStopwatchBtn');
        const delayDuration = 2000;
        const startTime = Date.now();

        delayBtn.disabled = true;

        stopwatchDelayStopTimer = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, delayDuration - elapsed);

            if (remaining > 0) {
                delayBtn.innerText = `${(remaining / 1000).toFixed(2)}s後停止`;
            } else {
                clearDelayTimersState();
                stopStopwatch();
            }
        }, 10);
    }

    function lapStopwatch() {
        if (stopwatchRunning) {
            const currentTotalElapsedTime = Date.now() - stopwatchStartTime + stopwatchElapsedTime;
            const lastLapTime = lapTimes.length > 0 ? lapTimes[lapTimes.length - 1].totalElapsedTime : 0;
            const lapDuration = currentTotalElapsedTime - lastLapTime;

            lapTimes.push({ totalElapsedTime: currentTotalElapsedTime, duration: lapDuration });
            const lapTimesList = document.getElementById('lapTimesList');
            const li = document.createElement('li');
            li.textContent = `Lap ${lapTimes.length}: ${formatTime(currentTotalElapsedTime)} (Lap: ${formatTime(lapDuration)})`;
            lapTimesList.prepend(li);
        }
    }

    function resetStopwatch() {
        const startStopwatchBtn = document.getElementById('startStopwatchBtn');
        const delayStartStopwatchBtn = document.getElementById('delayStartStopwatchBtn');
        const stopStopwatchBtn = document.getElementById('stopStopwatchBtn');
        const delayStopStopwatchBtn = document.getElementById('delayStopStopwatchBtn');
        const lapStopwatchBtn = document.getElementById('lapStopwatchBtn');

        clearDelayTimersState();
        clearInterval(stopwatchTimer);
        stopwatchStartTime = 0;
        stopwatchElapsedTime = 0;
        stopwatchRunning = false;
        lapTimes = [];
        document.getElementById('stopwatchDisplay').innerText = '00:00.000';
        document.getElementById('lapTimesList').innerHTML = '';

        startStopwatchBtn.style.display = 'inline-block';
        delayStartStopwatchBtn.style.display = 'inline-block';
        stopStopwatchBtn.style.display = 'none';
        delayStopStopwatchBtn.style.display = 'none';
        lapStopwatchBtn.style.display = 'none';
    }

    // ストップウォッチのタイムをカウントダウン1の切り上げ欄に転記する機能
    function transferToCountdownUp() {
        let targetMs = 0;
        if (lapTimes.length > 0) {
            targetMs = lapTimes[lapTimes.length - 1].duration;
        } else {
            targetMs = stopwatchRunning
                 ? (Date.now() - stopwatchStartTime + stopwatchElapsedTime)
                 : stopwatchElapsedTime;
        }

        const totalSeconds = targetMs / 1000;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = (totalSeconds % 60).toFixed(3);

        document.getElementById('countdownUpMin').value = minutes;
        document.getElementById('countdownUpSec').value = parseFloat(seconds);
    }

    function toggleNightMode() {
        document.body.classList.toggle('night-mode');
    }

    // Event Listeners
    document.getElementById('startCountdownBtn').addEventListener('click', initAndStartCountdown);
    document.getElementById('stopCountdownBtn').addEventListener('click', stopCountdownTimer);
    document.getElementById('resetCountdownBtn').addEventListener('click', resetCountdownTimer);

    document.getElementById('startCountdown2Btn').addEventListener('click', initAndStartCountdown2);
    document.getElementById('stopCountdown2Btn').addEventListener('click', stopCountdown2Timer);
    document.getElementById('resetCountdown2Btn').addEventListener('click', resetCountdown2Timer);

    window.onload = function() {
        resetMetronome();
        resetCountdownTimer();
        resetCountdown2Timer();
    };
</script>

</body></html>
